name: Free Jigyasa Image Generator (No Facebook)

on:
  schedule:
    # Daily at 6:30 AM India time (01:00 UTC)
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-jigyasa-image-generator
  cancel-in-progress: false

jobs:
  generate-and-commit:
    # This workflow only creates and commits a draft image. It never calls Facebook.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free drawing dependency and Hindi fonts
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra

      - name: Generate original Jigyasa artwork and caption
        run: python scripts/generate_free_image.py

      - name: Verify generated image
        run: |
          test -n "$(find drafts/images -maxdepth 1 -type f -name '*-jigyasa.jpg' -print -quit)"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path("drafts/images").glob("*-jigyasa.jpg"))
          if not files:
              raise SystemExit("No generated JPG found")
          image = Image.open(files[-1])
          image.verify()
          image = Image.open(files[-1])
          if image.size != (1080, 1350):
              raise SystemExit(f"Unexpected dimensions: {image.size}")
          if files[-1].stat().st_size < 20000:
              raise SystemExit("Generated image is unexpectedly small")
          print(f"Verified {files[-1]}: {image.size}, {files[-1].stat().st_size} bytes")
          PY

      - name: Commit generated image and draft only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/images/ drafts/*-jigyasa-post.md
          if git diff --cached --quiet; then
            echo "No new image or draft to commit."
            exit 0
          fi
          git commit -m "Generate free Jigyasa image and draft"
          git push

      - name: Verify committed image exists in HEAD
        run: |
          git cat-file -e "HEAD:drafts/images/$(TZ=Asia/Kolkata date +%F)-jigyasa.jpg"
          git log -1 --format='Committed image successfully: %h %s'
