name: Generate Free Jigyasa Image

# This workflow only generates and commits image drafts. It never publishes to Facebook.
on:
  workflow_dispatch:
  schedule:
    # Daily at 6:15 AM India time (00:45 UTC)
    - cron: "45 0 * * *"

permissions:
  contents: write

concurrency:
  group: generate-free-jigyasa-image
  cancel-in-progress: false

jobs:
  generate-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Devanagari fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
      - name: Install Pillow
        run: python -m pip install --upgrade Pillow
      - name: Generate image and metadata locally
        run: python generate_free_image.py
      - name: Verify image
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from datetime import datetime
          from zoneinfo import ZoneInfo
          day = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          path = Path("drafts/images") / f"{day}-jigyasa.jpg"
          if not path.is_file() or path.stat().st_size < 10000:
              raise SystemExit(f"Missing or too-small image: {path}")
          with Image.open(path) as image:
              image.verify()
          print(f"Verified {path}: {path.stat().st_size} bytes")
          PY
      - name: Commit image draft only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/images/
          if git diff --cached --quiet; then
            echo "No new image changes to commit."
          else
            git commit -m "Generate free Jigyasa image draft"
            git push
          fi
