name: Facebook Scheduled Publisher

on:
  schedule:
    - cron: "30 2 * * *" # 8:00 AM IST
    - cron: "30 7 * * *" # 1:00 PM IST
    - cron: "30 11 * * *" # 5:00 PM IST
    - cron: "0 16 * * *" # 9:30 PM IST
  workflow_dispatch:
    inputs:
      slot:
        description: "Prepared post slot to publish"
        required: true
        type: choice
        options:
          - "08:00"
          - "13:00"
          - "17:00"
          - "21:30"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Determine posting slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SLOT="$INPUT_SLOT"
          else
            case "$SCHEDULE" in
              "30 2 * * *") SLOT="08:00" ;;
              "30 7 * * *") SLOT="13:00" ;;
              "30 11 * * *") SLOT="17:00" ;;
              "0 16 * * *") SLOT="21:30" ;;
              *) echo "Unknown schedule: $SCHEDULE"; exit 1 ;;
            esac
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
      - name: Publish prepared image to Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_API_VERSION: v23.0
          POST_SLOT: ${{ steps.slot.outputs.slot }}
        run: python publish.py
