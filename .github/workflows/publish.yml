
name: Jigyasa Facebook Text Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-text-test:
    runs-on: ubuntu-latest

    steps:
      - name: Publish test text to Facebook Page
        env:
          PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import urllib.parse

          page_id = os.environ["PAGE_ID"]
          token = os.environ["PAGE_TOKEN"]

          url = f"https://graph.facebook.com/v23.0/{page_id}/feed"

          data = urllib.parse.urlencode({
              "message": (
                  "Jigyasa automation test. "
                  "Yeh ek test post hai—kripya ise ignore karein."
              ),
              "access_token": token
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

              if result.get("id"):
                  print("SUCCESS: Facebook text post published.")
                  print("Post ID:", result["id"])
              else:
                  print("Unexpected Facebook response.")
                  print(json.dumps(result))

          except urllib.error.HTTPError as error:
              print("Facebook API status:", error.code)
              print("Facebook API response:")
              print(
                  error.read().decode(
                      "utf-8", errors="replace"
                  )
              )
              raise
          PY
