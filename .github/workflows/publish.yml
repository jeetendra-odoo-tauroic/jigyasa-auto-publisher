name: Facebook Scheduled Publisher

on:
  schedule:
    # 7:00 AM IST
    - cron: "30 1 * * *"
    # 10:00 AM IST
    - cron: "30 4 * * *"
    # 1:30 PM IST
    - cron: "0 8 * * *"
    # 8:30 PM IST
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Prepared post slot to publish"
        required: true
        type: choice
        options:
          - "07:00"
          - "10:00"
          - "13:30"
          - "20:30"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Determine posting slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SLOT="$INPUT_SLOT"
          else
            case "$SCHEDULE" in
              "30 1 * * *") SLOT="07:00" ;;
              "30 4 * * *") SLOT="10:00" ;;
              "0 8 * * *") SLOT="13:30" ;;
              "0 15 * * *") SLOT="20:30" ;;
              *) echo "Unknown schedule: $SCHEDULE"; exit 1 ;;
            esac
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Publish prepared image to Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_API_VERSION: ${{ vars.FACEBOOK_GRAPH_API_VERSION || 'v23.0' }}
          POST_SLOT: ${{ steps.slot.outputs.slot }}
        run: python publish.py
