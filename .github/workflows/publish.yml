name: Jigyasa Facebook Image Publisher

on:
  schedule:
    # 7:00 AM IST
    - cron: "30 1 * * *"
    # 10:00 AM IST
    - cron: "30 4 * * *"
    # 1:30 PM IST
    - cron: "0 8 * * *"
    # Temporary test slot: 4:10 PM IST
    - cron: "40 10 * * *"
    # One-time intended run: 8:50 PM IST on 22 Oct 2026 (guarded below)
    - cron: "20 15 22 10 *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Post slot to generate and publish"
        required: true
        type: choice
        options:
          - "07:00"
          - "10:00"
          - "13:30"
          - "16:10"
          - "20:30"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Determine posting slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" = "20 15 22 10 *" ] && [ "$(date -u +%F)" != "2026-10-22" ]; then
            echo "One-time post trigger is only valid on 2026-10-22; skipping."
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SLOT="$INPUT_SLOT"
          elif [ "$EVENT_NAME" = "push" ]; then
            SLOT="16:10"
          else
            case "$SCHEDULE" in
              "30 1 * * *") SLOT="07:00" ;;
              "30 4 * * *") SLOT="10:00" ;;
              "0 8 * * *") SLOT="13:30" ;;
              "40 10 * * *") SLOT="16:10" ;;
              "20 15 22 10 *") SLOT="20:30" ;;
              *) echo "Unknown schedule"; exit 1 ;;
            esac
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Generate today's AI image and caption
        env:
          POST_SLOT: ${{ steps.slot.outputs.slot }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python generate_post.py --slot "$POST_SLOT"

      - name: Commit generated image and post metadata
        env:
          POST_SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          TODAY="$(TZ=Asia/Kolkata date +%F)"
          FILE_SLOT="${POST_SLOT//:/-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "content/$TODAY/$FILE_SLOT.jpg" "content/$TODAY/$FILE_SLOT.json"
          if git diff --cached --quiet; then
            echo "No generated content changes to commit."
          else
            git commit -m "Add generated post for $TODAY $POST_SLOT"
            git push
          fi

      - name: Publish generated image to Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_API_VERSION: v23.0
          POST_SLOT: ${{ steps.slot.outputs.slot }}
        run: python publish.py
